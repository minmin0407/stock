name: 每日更新法人籌碼

on:
  schedule:
    # 台北時間 17:20 與 19:00（UTC+8），週一到週五。
    # 證交所約 16:00 後才公布，跑兩次是為了保險 —— 資料已存在時第二次不會做事。
    - cron: '20 9 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '回補幾天歷史（首次設定請填 130，平常留空）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-flows
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取資料
        run: |
          if [ -n "${{ github.event.inputs.backfill_days }}" ]; then
            echo "回補模式：${{ github.event.inputs.backfill_days }} 天"
            python scripts/fetch_flows.py backfill --days "${{ github.event.inputs.backfill_days }}"
          else
            python scripts/fetch_flows.py update
          fi

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "沒有新資料，略過提交"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
